name: Publish

# Publishing to winget is opt-in: it needs a package that already exists in
# microsoft/winget-pkgs and a WINGET_TOKEN secret. Set the repository variable
# WINGET_PUBLISH=true to enable it. The trigger stays on `release` because the
# action below reads the release event.
on:
  release:
    types: [ released ]

permissions: {}

jobs:
  winget:
    name: Winget
    if: ${{ vars.WINGET_PUBLISH == 'true' }}

    permissions:
      contents: read

    runs-on: ubuntu-slim

    steps:
      - name: Publish on Winget
        # @Octol1ttle: Pinned to a commit because no release has been published that works on ubuntu-slim
        uses: vedantmgoyal2009/winget-releaser@7bd472be23763def6e16bd06cc8b1cdfab0e2fd5 # docs: add description to inputs (#335)
        with:
          identifier: WickedLauncher.WickedLauncher
          version: ${{ github.event.release.tag_name }}
          installers-regex: 'WickedLauncher-Windows-MSVC(:?-arm64|-Legacy)?-Setup-.+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
