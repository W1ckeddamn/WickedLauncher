name: Sync Upstream

on:
  schedule:
    # Запуск каждую ночь в 03:00 UTC (06:00 по МСК)
    - cron: '0 3 * * *'
  workflow_dispatch: # Возможность запустить синхронизацию вручную в любой момент из вкладки Actions

permissions:
  contents: write

jobs:
  sync:
    name: Sync with PrismLauncher/PrismLauncher develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/PrismLauncher/PrismLauncher.git
          git fetch upstream develop

          # Сливаем без коммита: CI-файлы форка нужно оставить своими.
          git merge upstream/develop --no-ff --no-commit --allow-unrelated-histories

          # GITHUB_TOKEN не может пушить файлы workflow, а CI у форка свой.
          # shortcut: изменения CI из upstream пропускаются; переносить вручную, когда нужно.
          git rm -r -q --cached .github/workflows
          git checkout HEAD -- .github/workflows
          git clean -fdq .github/workflows

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            if git diff --cached --quiet; then
              git merge --abort
            else
              git commit -m "chore: sync with upstream PrismLauncher/develop"
            fi
          fi

          # Обновляем сабмодули при необходимости
          git submodule update --init --recursive

          # Отправляем в ваш форк
          git push origin develop
