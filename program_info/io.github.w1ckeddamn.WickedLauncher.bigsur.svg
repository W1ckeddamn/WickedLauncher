<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Wicked Launcher</title>
  <desc>macOS application icon</desc>

  <defs>
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <!-- Wicked crystal mark: light-surface variant -->
    <g id="wicked-mark">
      <polygon points="100,28 160,62 160,138 100,172 40,138 40,62" fill="#383838" />
      <polygon points="100,28 160,62 160,138 100,172 100,100" fill="#242424" />
      <polygon points="100,28 75,80 100,105 125,80" fill="#e6e6e6" />
      <polygon points="40,62 75,80 58,118" fill="#cccccc" />
      <polygon points="160,62 125,80 142,118" fill="#8c8c8c" />
      <polygon points="100,172 72,122 100,105 128,122" fill="#f2f2f2" />
      <polygon points="100,172 128,122 100,105" fill="#a6a6a6" />
    </g>
  </defs>

  <!-- macOS squircle -->
  <g filter="url(#icon-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#f7f7f8" />
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#d8d8dc" stroke-width="2" />
  </g>

  <use href="#wicked-mark" transform="translate(112,112) scale(4)" />
</svg>
