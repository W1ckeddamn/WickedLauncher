<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <title>Wicked Launcher</title>
  <desc>Editable source for the Wicked Launcher horizontal logo</desc>

  <defs>
    <style>
      .bold-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 48px;
      }
      .regular-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 48px;
      }
    </style>

    <!-- Wicked crystal mark: light-surface variant -->
    <g id="wicked-mark">
      <polygon points="100,28 160,62 160,138 100,172 40,138 40,62" fill="#383838" />
      <polygon points="100,28 160,62 160,138 100,172 100,100" fill="#242424" />
      <polygon points="100,28 75,80 100,105 125,80" fill="#e6e6e6" />
      <polygon points="40,62 75,80 58,118" fill="#cccccc" />
      <polygon points="160,62 125,80 142,118" fill="#8c8c8c" />
      <polygon points="100,172 72,122 100,105 128,122" fill="#f2f2f2" />
      <polygon points="100,172 128,122 100,105" fill="#a6a6a6" />
    </g>
  </defs>

  <use href="#wicked-mark" transform="translate(-32,0)" />

  <text x="156" y="122" fill="#000000" letter-spacing="-1.2">
    <tspan class="bold-text">Wicked</tspan><tspan class="regular-text">&#160;Launcher</tspan>
  </text>
</svg>
