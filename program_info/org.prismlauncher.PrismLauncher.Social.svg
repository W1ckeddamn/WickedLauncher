<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <title>Wicked Launcher</title>
  <desc>Wicked Launcher social banner in light and dark themes</desc>

  <defs>
    <style>
      .bold-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 44px;
      }
      .regular-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 44px;
      }
    </style>

    <!-- Wicked crystal mark: light-surface variant -->
    <g id="wicked-mark">
      <polygon points="100,28 160,62 160,138 100,172 40,138 40,62" fill="#383838" />
      <polygon points="100,28 160,62 160,138 100,172 100,100" fill="#242424" />
      <polygon points="100,28 75,80 100,105 125,80" fill="#e6e6e6" />
      <polygon points="40,62 75,80 58,118" fill="#cccccc" />
      <polygon points="160,62 125,80 142,118" fill="#8c8c8c" />
      <polygon points="100,172 72,122 100,105 128,122" fill="#f2f2f2" />
      <polygon points="100,172 128,122 100,105" fill="#a6a6a6" />
    </g>

    <!-- Wicked crystal mark: dark-surface variant -->
    <g id="wicked-mark-dark">
      <polygon points="100,28 160,62 160,138 100,172 40,138 40,62" fill="#e0e0e0" />
      <polygon points="100,28 160,62 160,138 100,172 100,100" fill="#b8b8b8" />
      <polygon points="100,28 75,80 100,105 125,80" fill="#333333" />
      <polygon points="40,62 75,80 58,118" fill="#4d4d4d" />
      <polygon points="160,62 125,80 142,118" fill="#222222" />
      <polygon points="100,172 72,122 100,105 128,122" fill="#2b2b2b" />
      <polygon points="100,172 128,122 100,105" fill="#171717" />
    </g>
  </defs>

  <!-- Light panel -->
  <g id="light-theme">
    <rect x="0" y="0" width="600" height="235" rx="20" fill="#f7f7f8" />
    <use href="#wicked-mark" x="20" y="18" />
    <text x="190" y="132" fill="#000000" letter-spacing="-1">
      <tspan class="bold-text">Wicked</tspan><tspan class="regular-text">&#160;Launcher</tspan>
    </text>
  </g>

  <!-- Dark panel -->
  <g id="dark-theme" transform="translate(0,265)">
    <rect x="0" y="0" width="600" height="235" rx="20" fill="#1c1c1e" />
    <use href="#wicked-mark-dark" x="20" y="18" />
    <text x="190" y="132" fill="#ffffff" letter-spacing="-1">
      <tspan class="bold-text">Wicked</tspan><tspan class="regular-text">&#160;Launcher</tspan>
    </text>
  </g>
</svg>
