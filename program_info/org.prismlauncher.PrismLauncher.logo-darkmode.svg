<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <title>Wicked Launcher</title>
  <desc>Wicked Launcher horizontal logo for dark backgrounds</desc>

  <defs>
    <style>
      .bold-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 48px;
      }
      .regular-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 48px;
      }
    </style>

    <!-- Wicked crystal mark: dark-surface variant -->
    <g id="wicked-mark-dark">
      <polygon points="100,28 160,62 160,138 100,172 40,138 40,62" fill="#e0e0e0" />
      <polygon points="100,28 160,62 160,138 100,172 100,100" fill="#b8b8b8" />
      <polygon points="100,28 75,80 100,105 125,80" fill="#333333" />
      <polygon points="40,62 75,80 58,118" fill="#4d4d4d" />
      <polygon points="160,62 125,80 142,118" fill="#222222" />
      <polygon points="100,172 72,122 100,105 128,122" fill="#2b2b2b" />
      <polygon points="100,172 128,122 100,105" fill="#171717" />
    </g>
  </defs>

  <use href="#wicked-mark-dark" transform="translate(-32,0)" />

  <text x="156" y="122" fill="#ffffff" letter-spacing="-1.2">
    <tspan class="bold-text">Wicked</tspan><tspan class="regular-text">&#160;Launcher</tspan>
  </text>
</svg>
