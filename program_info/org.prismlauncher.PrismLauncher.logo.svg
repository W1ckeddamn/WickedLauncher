<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Mystic Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="1"/>
      <stop offset="35%" stop-color="#c026d3" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#7e22ce" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>

    <!-- Obsidian Facet Gradients -->
    <linearGradient id="obsidianTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="50%" stop-color="#170428"/>
      <stop offset="100%" stop-color="#090114"/>
    </linearGradient>

    <linearGradient id="obsidianLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#090212"/>
    </linearGradient>

    <linearGradient id="obsidianRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="60%" stop-color="#240747"/>
      <stop offset="100%" stop-color="#0f021f"/>
    </linearGradient>

    <linearGradient id="obsidianBottom" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#07000d"/>
      <stop offset="100%" stop-color="#1d0433"/>
    </linearGradient>

    <linearGradient id="innerGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="40%" stop-color="#c026d3"/>
      <stop offset="80%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(20, 20) scale(0.39)">
    <!-- Ambient Backdrop Glow -->
    <circle cx="256" cy="256" r="230" fill="url(#outerGlow)"/>

    <!-- Vertex Spikes -->
    <polygon points="256,28 320,130 256,105 192,130" fill="url(#obsidianTop)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="256,484 192,382 256,407 320,382" fill="url(#obsidianBottom)" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="38,256 140,192 115,256 140,320" fill="url(#obsidianLeft)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="474,256 372,192 397,256 372,320" fill="url(#obsidianRight)" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Main Octahedral Prism Body -->
    <polygon points="256,64 420,256 256,448 92,256" fill="#0c0217" stroke="#3b0764" stroke-width="4"/>
    <polygon points="256,64 92,256 256,256" fill="url(#obsidianLeft)"/>
    <polygon points="256,64 420,256 256,256" fill="url(#obsidianRight)"/>
    <polygon points="92,256 256,448 256,256" fill="url(#obsidianBottom)"/>
    <polygon points="420,256 256,448 256,256" fill="url(#obsidianTop)"/>

    <!-- Core Glow & Jewel -->
    <circle cx="256" cy="256" r="105" fill="url(#coreGlow)"/>
    <g filter="url(#runeGlow)">
      <polygon points="256,155 357,256 256,357 155,256" fill="url(#innerGem)" stroke="#f0abfc" stroke-width="2"/>
      <polygon points="256,200 295,256 256,312 217,256" fill="#fae8ff" opacity="0.85"/>
    </g>

    <!-- Runes -->
    <g stroke="#d8b4fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" filter="url(#runeGlow)">
      <path d="M190,130 L160,160 L180,180"/>
      <path d="M322,130 L352,160 L332,180"/>
      <path d="M190,382 L160,352 L180,332"/>
      <path d="M322,382 L352,352 L332,332"/>
    </g>

    <polygon points="256,64 420,256 256,448 92,256" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>

  <!-- Typography: WICKED LAUNCHER -->
  <text x="250" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="2">WICKED</text>
  <text x="254" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="600" fill="#a855f7" letter-spacing="6">LAUNCHER</text>
</svg>
